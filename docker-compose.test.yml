services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dss_test
      POSTGRES_PASSWORD: dss_test
      POSTGRES_DB: dss_test
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dss_test -d dss_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
