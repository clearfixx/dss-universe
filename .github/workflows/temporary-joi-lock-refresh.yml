name: Temporary joi lock refresh
on:
  push:
    branches:
      - feature/application-shell-v1
    paths:
      - apps/api/package.json
      - .github/workflows/temporary-joi-lock-refresh.yml

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Regenerate lockfile with package manager
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Verify frozen resolution
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit only generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): refresh joi lock resolution with pnpm'
            git push origin HEAD:feature/application-shell-v1
          fi
