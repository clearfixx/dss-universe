name: Storage native P1

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: storage-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native capability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: 3.14.10
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Record Node and Python toolchain
        run: |
          node -p "JSON.stringify({node:process.version,napi:process.versions.napi,platform:process.platform,arch:process.arch})"
          python --version
      - name: Record POSIX compiler
        if: runner.os != 'Windows'
        run: c++ --version
      - name: Build and verify real native capabilities
        run: pnpm --filter @dss/storage native:verify
