name: Storage native P1

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: storage-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native capability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: 3.14.10
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Record Node and Python toolchain
        run: |
          node -p "JSON.stringify({node:process.version,napi:process.versions.napi,platform:process.platform,arch:process.arch})"
          python --version
      - name: Record POSIX compiler
        if: runner.os != 'Windows'
        run: c++ --version
      - name: Build and verify real native capabilities
        env:
          PYTHON: ${{ steps.python.outputs['python-path'] }}
        run: pnpm --filter @dss/storage native:verify
      - name: Verify cross-process storage coordination primitives
        run: pnpm storage:coordination:verify
      - name: Prove POSIX ACL contracts with real ordinary identities
        if: runner.os != 'Windows'
        env:
          DSS_ACL_CONTRACT_PROOF: "1"
        run: node tools/agent-helpers/debt037/run-acl-contract-proof.mjs
      - name: Preserve bounded ACL contract evidence
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: acl-contract-${{ runner.os }}
          path: node_modules/.cache/acl-contract-proof-*.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Verify current-user Windows JS bootstrap without logons
        if: runner.os == 'Windows'
        run: node tools/agent-helpers/debt037/r5/windows-bootstrap-preflight.mjs
      - name: Prove role rights in actual ordinary Node processes
        env:
          DSS_RIGHTS_ACTOR_PROOF: "1"
          PYTHON: ${{ steps.python.outputs['python-path'] }}
        run: node tools/agent-helpers/debt037/r5/run-proof.mjs
      - name: Preserve bounded role rights evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role-rights-${{ runner.os }}
          path: node_modules/.cache/rights-actor-*.json
          include-hidden-files: true
          if-no-files-found: warn
