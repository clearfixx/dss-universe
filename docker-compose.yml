services:
  postgres:
    image: postgres:17-alpine
    container_name: dss_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - dss_postgres_data:/var/lib/postgresql/data
    networks:
      - dss_network

  redis:
    image: redis:7-alpine
    container_name: dss_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - dss_redis_data:/data
    networks:
      - dss_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dss_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres
    volumes:
      - dss_pgadmin_data:/var/lib/pgadmin
    networks:
      - dss_network

volumes:
  dss_postgres_data:
  dss_redis_data:
  dss_pgadmin_data:

networks:
  dss_network:
    driver: bridge
