# Forum trash (P1 B07): trashed topics of the sections the viewer moderates.
query ForumTrash($page: Int!, $limit: Int!, $forumId: ID, $search: String) {
  forumTrash(page: $page, limit: $limit, forumId: $forumId, search: $search) {
    total
    page
    limit
    items {
      ...ForumTopicSummary
      trashedAt
      trashedBy {
        id
        username
        displayName
        avatarUrl
      }
    }
  }
}

# Post network metadata (P1 B11): staff-only, every read is audited.
query ForumPostNetwork($postId: ID!) {
  forumPostNetwork(postId: $postId) {
    postId
    ipAddress
    userAgent
    capturedAt
    device {
      kind
      browser
      os
    }
  }
}

mutation DeleteForumPostNetwork($postId: ID!, $reason: String!) {
  deleteForumPostNetwork(postId: $postId, reason: $reason)
}
