query EditorMedia($input: MediaLibraryInput) {
  editorMedia(input: $input) {
    items {
      id
      kind
      originalFilename
      mimeType
      width
      height
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query EditorMentionSuggestions($input: MembersDirectoryInput) {
  members(input: $input) {
    items {
      id
      username
      displayName
      avatarUrl
      isOnline
    }
    total
  }
}

mutation InitiateEditorMediaUpload($input: InitiateMediaUploadInput!) {
  initiateMediaUpload(input: $input) {
    id
    status
    originalFilename
  }
}

mutation CreateEditorContentGate($input: CreateContentGateInput!) {
  createContentGate(input: $input) {
    id
    operator
    requirements {
      id
      kind
      threshold
      groupKey
    }
  }
}
